# Site estatico servido da raiz; as Functions ficam em netlify/functions.
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# O jogo usa modulos ES (<script type="module">), entao os .js precisam do
# Content-Type correto. O Netlify ja faz isso, mas deixamos explicito.
[[headers]]
  for = "/src/*"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
